<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RVHSA-P</title>
  <style>
    :root {
      --blue-dark: #0f2f57;
      --blue: #1f5f99;
      --blue-light: #eaf3fb;
      --text: #17324d;
      --white: #ffffff;
      --border: #c9dced;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eaf3fb, #d7e9f8);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(92%, 700px);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 16px 40px rgba(15, 47, 87, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: var(--blue-dark);
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0 0 28px;
      color: #5f7890;
      font-size: 1.05rem;
    }

    a {
      display: inline-block;
      padding: 16px 24px;
      border-radius: 14px;
      background: var(--blue);
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      transition: transform 120ms ease, background 120ms ease;
    }

    a:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 4px solid rgba(31, 95, 153, 0.25);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>RVHS Anatomy & Physiology Study Tools</h1>
    <p>Select a tool below to begin.</p>

    <a href="anatomy-regions-quiz/">
      Anatomical Regions Quiz
    </a>
    <a href="body-cavities-quiz/">
    Body Cavities Quiz
    </a>
  </main>
</body>
</html>
